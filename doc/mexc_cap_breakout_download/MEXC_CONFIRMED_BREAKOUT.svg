<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="2038" version="1.1" viewBox="0 0 3285 2038" width="3285" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FCFDFE" height="2038" width="3285" x="0" y="0" /><rect fill="#0B3654" height="113" rx="18" width="3195" x="45" y="14" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="38" font-weight="bold" x="75" y="62">АЛГОРИТМ B — CONFIRMED BREAKOUT</text><text fill="#D9EAF6" font-family="DejaVu Sans" font-size="21" font-weight="normal" x="76" y="105">Стабилизация стакана, вход, частичные TP, общий PnL и аварийный SELL</text><rect fill="#EAF6FD" height="395" rx="14" stroke="#0C87D1" stroke-width="2.6" width="1035" x="42" y="160" /><rect fill="#0C87D1" height="76" rx="14" width="1035" x="42" y="160" /><rect fill="#0C87D1" height="33" width="1035" x="42" y="203" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="57" y="174" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="72" y="211">B1</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="142" y="211">CAP_RELEASED</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="276">• Открыть CONFIRMED окно на 30 секунд</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="324">• Создать счётчики stableSince и updates</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="372">• Конфликт позиции → SKIP</text><rect fill="#FFF7DC" height="395" rx="14" stroke="#E2A115" stroke-width="2.6" width="1035" x="1125" y="160" /><rect fill="#E2A115" height="76" rx="14" width="1035" x="1125" y="160" /><rect fill="#E2A115" height="33" width="1035" x="1125" y="203" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="1140" y="174" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1155" y="211">B2</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1225" y="211">Новая рыночная порция</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="276">• Принимать только реальные новые WS события</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="324">• Проверять sequence и возраст ≤500 мс</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="372">• Gap → восстановить стакан; reset</text><rect fill="#E8F8EF" height="395" rx="14" stroke="#12A360" stroke-width="2.6" width="1035" x="2208" y="160" /><rect fill="#12A360" height="76" rx="14" width="1035" x="2208" y="160" /><rect fill="#12A360" height="33" width="1035" x="2208" y="203" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="2223" y="174" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2238" y="211">B3</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2308" y="211">Все фильтры сразу</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="276">• Spread ≤1.2%; bid07 ≥15×, bid15 ≥30×</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="324">• Ask07 ≥8×; exit slip ≤1.5%</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="372">• Любой fail → обнулить stableSince</text><rect fill="#F1ECFF" height="395" rx="14" stroke="#7552C7" stroke-width="2.6" width="1035" x="2208" y="621" /><rect fill="#7552C7" height="76" rx="14" width="1035" x="2208" y="621" /><rect fill="#7552C7" height="33" width="1035" x="2208" y="664" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="2223" y="635" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2238" y="672">B4</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2308" y="672">Проверить устойчивость</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="737">• Непрерывное выполнение ≥200 мс</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="785">• ≥3 разных bookVersion/WS обновления</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="833">• Таймеры пересчёта НЕ считаются событиями</text><rect fill="#FFF2E7" height="395" rx="14" stroke="#E77826" stroke-width="2.6" width="1035" x="1125" y="621" /><rect fill="#E77826" height="76" rx="14" width="1035" x="1125" y="621" /><rect fill="#E77826" height="33" width="1035" x="1125" y="664" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="1140" y="635" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1155" y="672">B5</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1225" y="672">Сценарный риск</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="737">• BuyVWAP, exitVWAP и будущий stress</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="785">• Проверить цену, разворот, резерв риска</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="833">• Нет → сбросить streak/ждать</text><rect fill="#EAF6FD" height="395" rx="14" stroke="#0C87D1" stroke-width="2.6" width="1035" x="42" y="621" /><rect fill="#0C87D1" height="76" rx="14" width="1035" x="42" y="621" /><rect fill="#0C87D1" height="33" width="1035" x="42" y="664" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="57" y="635" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="72" y="672">B6</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="142" y="672">Pre-send проверка</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="737">• Перед LIMIT BUY обновить bid/ask/qty</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="785">• Не догонять цену и не превышать cap BUY</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="833">• Если плохой рынок → возврат к B2</text><rect fill="#E8F8EF" height="395" rx="14" stroke="#12A360" stroke-width="2.6" width="1035" x="42" y="1082" /><rect fill="#12A360" height="76" rx="14" width="1035" x="42" y="1082" /><rect fill="#12A360" height="33" width="1035" x="42" y="1125" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="57" y="1096" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="72" y="1133">B7</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="142" y="1133">Единственный BUY</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1198">• LIMIT по bestAsk +1%; qty по USDT</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1246">• Уникальный clientOrderId</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1294">• Неотвеченный API → RECONCILE</text><rect fill="#F1ECFF" height="395" rx="14" stroke="#7552C7" stroke-width="2.6" width="1035" x="1125" y="1082" /><rect fill="#7552C7" height="76" rx="14" width="1035" x="1125" y="1082" /><rect fill="#7552C7" height="33" width="1035" x="1125" y="1125" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="1140" y="1096" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1155" y="1133">B8</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1225" y="1133">Контроль fills</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1198">• До 1200 мс; cancel оставшуюся заявку</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1246">• Partial → только фактический объём</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1294">• Zero fill → SKIP, без повторного BUY</text><rect fill="#FFF7DC" height="395" rx="14" stroke="#E2A115" stroke-width="2.6" width="1035" x="2208" y="1082" /><rect fill="#E2A115" height="76" rx="14" width="1035" x="2208" y="1082" /><rect fill="#E2A115" height="33" width="1035" x="2208" y="1125" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="2223" y="1096" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2238" y="1133">B9</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2308" y="1133">Управление остатком</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1198">• TP1/TP2 после minNotional проверки</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1246">• Оценка полного PnL после каждого fill</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1294">• Не считать касание тейка исполнением</text><rect fill="#E4F7F4" height="395" rx="14" stroke="#149B95" stroke-width="2.6" width="1035" x="2208" y="1543" /><rect fill="#149B95" height="76" rx="14" width="1035" x="2208" y="1543" /><rect fill="#149B95" height="33" width="1035" x="2208" y="1586" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="2223" y="1557" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2238" y="1594">B10</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2308" y="1594">Общая защита</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1659">• C/R/Q, стрессовый exitVWAP и P_BE</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1707">• TP1 исполнен частично → защита слабее</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1755">• Если целевая прибыль под угрозой → EXIT</text><rect fill="#FFF0EF" height="395" rx="14" stroke="#D85257" stroke-width="2.6" width="1035" x="1125" y="1543" /><rect fill="#D85257" height="76" rx="14" width="1035" x="1125" y="1543" /><rect fill="#D85257" height="33" width="1035" x="1125" y="1586" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="1140" y="1557" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1155" y="1594">B11</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1225" y="1594">Urgent SELL</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1659">• Cancel TP и сверка fills, затем новый Q</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1707">• LIMIT SELL / bounded cancel-reprice</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1755">• UNKNOWN никогда не дублировать</text><rect fill="#EAF6FD" height="395" rx="14" stroke="#0C87D1" stroke-width="2.6" width="1035" x="42" y="1543" /><rect fill="#0C87D1" height="76" rx="14" width="1035" x="42" y="1543" /><rect fill="#0C87D1" height="33" width="1035" x="42" y="1586" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="57" y="1557" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="72" y="1594">B12</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="142" y="1594">Финал CONFIRMED</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1659">• Deadline без стабильности → SKIP</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1707">• После входа закрытие только Q=0</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1755">• Сохранить исполнение, риски, slippage</text><polyline fill="none" opacity="0.92" points="1077,357.5 1125,357.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="1125,357.5 1107.8915050552991,365.76434514811336 1107.8915050552991,349.23565485188664" /><polyline fill="none" opacity="0.92" points="2160,357.5 2208,357.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2208,357.5 2190.891505055299,365.76434514811336 2190.891505055299,349.23565485188664" /><polyline fill="none" opacity="0.92" points="2725.5,555 2725.5,621" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2725.5,621 2717.2356548518865,603.8915050552991 2733.7643451481135,603.8915050552991" /><polyline fill="none" opacity="0.92" points="2208,818.5 2160,818.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2160,818.5 2177.108494944701,810.2356548518866 2177.108494944701,826.7643451481134" /><polyline fill="none" opacity="0.92" points="1125,818.5 1077,818.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="1077,818.5 1094.1084949447009,810.2356548518866 1094.1084949447009,826.7643451481134" /><polyline fill="none" opacity="0.92" points="559.5,1016 559.5,1082" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="559.5,1082 551.2356548518866,1064.8915050552991 567.7643451481134,1064.8915050552991" /><polyline fill="none" opacity="0.92" points="1077,1279.5 1125,1279.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="1125,1279.5 1107.8915050552991,1287.7643451481133 1107.8915050552991,1271.2356548518867" /><polyline fill="none" opacity="0.92" points="2160,1279.5 2208,1279.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2208,1279.5 2190.891505055299,1287.7643451481133 2190.891505055299,1271.2356548518867" /><polyline fill="none" opacity="0.92" points="2725.5,1477 2725.5,1543" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2725.5,1543 2717.2356548518865,1525.8915050552991 2733.7643451481135,1525.8915050552991" /><polyline fill="none" opacity="0.92" points="2208,1740.5 2160,1740.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2160,1740.5 2177.108494944701,1732.2356548518867 2177.108494944701,1748.7643451481133" /><polyline fill="none" opacity="0.92" points="1125,1740.5 1077,1740.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="1077,1740.5 1094.1084949447009,1732.2356548518867 1094.1084949447009,1748.7643451481133" /><rect fill="#E9F0F4" height="47" rx="8" width="3195" x="45" y="1966" /><text fill="#294458" font-family="DejaVu Sans" font-size="20" font-weight="normal" x="65" y="1997">ПРИОРИТЕТ: STOP / UNKNOWN ORDERS &gt; защита общего PnL &gt; TP-исполнения; все решения по реальным fills, не последней цене</text></svg>