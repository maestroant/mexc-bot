<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1852" version="1.1" viewBox="0 0 3628 1852" width="3628" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FCFDFE" height="1852" width="3628" x="0" y="0" /><rect fill="#0B3654" height="113" rx="18" width="3538" x="45" y="14" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="38" font-weight="bold" x="75" y="62">ТОРГОВАЯ ЛОГИКА MEXC — СНЯТИЕ ЦЕНОВОГО ПОТОЛКА</text><text fill="#D9EAF6" font-family="DejaVu Sans" font-size="21" font-weight="normal" x="76" y="105">Операционная карта: 11 этапов, две стратегии входа, единая защита PnL и контроль исполнения</text><rect fill="#EAF6FD" height="480" rx="14" stroke="#0C87D1" stroke-width="2.6" width="850" x="42" y="160" /><rect fill="#0C87D1" height="76" rx="14" width="850" x="42" y="160" /><rect fill="#0C87D1" height="33" width="850" x="42" y="203" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="57" y="174" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="72" y="211">1</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="142" y="211">Новый листинг</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="276">• Получить symbol, время, tick/qty step и комиссии</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="324">• Подключить WS: deals, bookTicker, diff-depth</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="372">• Собрать локальный стакан; открыть ledger</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="62" y="590" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="74" y="613">Нет стакана → восстановление; BUY запрещён</text><rect fill="#E8F8EF" height="480" rx="14" stroke="#12A360" stroke-width="2.6" width="850" x="940" y="160" /><rect fill="#12A360" height="76" rx="14" width="850" x="940" y="160" /><rect fill="#12A360" height="33" width="850" x="940" y="203" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="955" y="174" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="970" y="211">2</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1040" y="211">Определить потолок</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="968" y="276">• Подтвердить capPrice: источник + время</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="968" y="324">• Ошибка 30010 может содержать верхнюю границу</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="968" y="372">• order/test и плоская цена НЕ доказывают cap</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="960" y="590" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="972" y="613">Нет cap → OBSERVE ONLY</text><rect fill="#FFF7DC" height="480" rx="14" stroke="#E2A115" stroke-width="2.6" width="850" x="1838" y="160" /><rect fill="#E2A115" height="76" rx="14" width="850" x="1838" y="160" /><rect fill="#E2A115" height="33" width="850" x="1838" y="203" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="1853" y="174" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1868" y="211">3</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1938" y="211">Ожидать разблокировку</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1866" y="276">• Мониторить сделки и bid/ask непрерывно</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1866" y="324">• T+600 — лишь ориентир для известных 10 минут</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1866" y="372">• При потере depth sequence — BOOK_RECOVERY</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="1858" y="590" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="1870" y="613">До release ни один CAP BUY не отправляется</text><rect fill="#F1ECFF" height="480" rx="14" stroke="#7552C7" stroke-width="2.6" width="850" x="2736" y="160" /><rect fill="#7552C7" height="76" rx="14" width="850" x="2736" y="160" /><rect fill="#7552C7" height="33" width="850" x="2736" y="203" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="2751" y="174" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2766" y="211">4</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2836" y="211">Подтвердить снятие</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2764" y="276">• Реальная сделка строго выше capPrice</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2764" y="324">• BestBid тоже выше capPrice + шаг цены</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2764" y="372">• Стакан свежий и синхронизированный</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="2756" y="590" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="2768" y="613">Все условия ДА → единственный CAP_RELEASED</text><rect fill="#E4F7F4" height="480" rx="14" stroke="#149B95" stroke-width="2.6" width="850" x="2736" y="716" /><rect fill="#149B95" height="76" rx="14" width="850" x="2736" y="716" /><rect fill="#149B95" height="33" width="850" x="2736" y="759" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="2751" y="730" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2766" y="767">5</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2836" y="767">Выбрать алгоритм</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2764" y="832">• В LIVE активен только FAST ИЛИ CONFIRMED</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2764" y="880">• Проверить позиции и неизвестные ордера</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2764" y="928">• В REPLAY обе стратегии независимы</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="2756" y="1146" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="2768" y="1169">Нет конфликтов → переход к выбранной ветке</text><rect fill="#FFF2E7" height="480" rx="14" stroke="#E77826" stroke-width="2.6" width="850" x="1838" y="716" /><rect fill="#E77826" height="76" rx="14" width="850" x="1838" y="716" /><rect fill="#E77826" height="33" width="850" x="1838" y="759" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="1853" y="730" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1868" y="767">6A</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1938" y="767">FAST BREAKOUT</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1866" y="832">• Сканировать подходящий стакан максимум 10 с</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1866" y="880">• Без 200 мс стабилизации, но с depth/VWAP</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1866" y="928">• Проверить spread, stress-loss, chase</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="1858" y="1146" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="1870" y="1169">Первая безопасная котировка → BUY</text><rect fill="#EAF6FD" height="480" rx="14" stroke="#0C87D1" stroke-width="2.6" width="850" x="940" y="716" /><rect fill="#0C87D1" height="76" rx="14" width="850" x="940" y="716" /><rect fill="#0C87D1" height="33" width="850" x="940" y="759" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="955" y="730" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="970" y="767">6B</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1040" y="767">CONFIRMED BREAKOUT</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="968" y="832">• Сканировать не дольше 30 с</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="968" y="880">• Все фильтры стабильны ≥200 мс</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="968" y="928">• Требовать ≥3 независимых обновления</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="960" y="1146" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="972" y="1169">Данные испортились → сбросить стабильность</text><rect fill="#E8F8EF" height="480" rx="14" stroke="#12A360" stroke-width="2.6" width="850" x="42" y="716" /><rect fill="#12A360" height="76" rx="14" width="850" x="42" y="716" /><rect fill="#12A360" height="33" width="850" x="42" y="759" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="57" y="730" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="72" y="767">7</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="142" y="767">LIMIT BUY</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="832">• price ≤ bestAsk × 1.01; qty по orderUSDT</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="880">• Покупка одна: timeout 1200 мс</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="928">• Cancel/reconcile остатка; partial → ledger</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="62" y="1146" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="74" y="1169">UNKNOWN → сверка; нет fills → SKIP</text><rect fill="#F1ECFF" height="480" rx="14" stroke="#7552C7" stroke-width="2.6" width="850" x="42" y="1272" /><rect fill="#7552C7" height="76" rx="14" width="850" x="42" y="1272" /><rect fill="#7552C7" height="33" width="850" x="42" y="1315" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="57" y="1286" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="72" y="1323">8</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="142" y="1323">TP1 / TP2 и fills</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1388">• TP1 +2% на 50%; TP2 +4% на остаток</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1436">• Важны fills, не касания цен; minNotional</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1484">• После любого SELL → обновить R, Q, fees</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="62" y="1702" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="74" y="1725">TP1 в плюс не означает плюс всей сделки</text><rect fill="#FFF7DC" height="480" rx="14" stroke="#E2A115" stroke-width="2.6" width="850" x="940" y="1272" /><rect fill="#E2A115" height="76" rx="14" width="850" x="940" y="1272" /><rect fill="#E2A115" height="33" width="850" x="940" y="1315" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="955" y="1286" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="970" y="1323">9</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1040" y="1323">Защита общего PnL</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="968" y="1388">• C = все BUY + fee; R = SELL после fee</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="968" y="1436">• Остаток оценивается по exitVWAP и stress</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="968" y="1484">• После частичного TP — BE/LOCK по всей сделке</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="960" y="1702" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="972" y="1725">Ожидаемый итог ниже цели → EXIT_URGENT</text><rect fill="#FFF0EF" height="480" rx="14" stroke="#D85257" stroke-width="2.6" width="850" x="1838" y="1272" /><rect fill="#D85257" height="76" rx="14" width="850" x="1838" y="1272" /><rect fill="#D85257" height="33" width="850" x="1838" y="1315" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="1853" y="1286" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1868" y="1323">10</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1938" y="1323">Срочная продажа</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1866" y="1388">• Cancel TP → сверить fills → вычислить Q</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1866" y="1436">• Aggressive LIMIT SELL, до 3 перестановок</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1866" y="1484">• Критический fallback; никаких слепых дублей</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="1858" y="1702" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="1870" y="1725">Невыведенный остаток → RESIDUAL_OPEN</text><rect fill="#EAF6FD" height="480" rx="14" stroke="#0C87D1" stroke-width="2.6" width="850" x="2736" y="1272" /><rect fill="#0C87D1" height="76" rx="14" width="850" x="2736" y="1272" /><rect fill="#0C87D1" height="33" width="850" x="2736" y="1315" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="2751" y="1286" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2766" y="1323">11</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2836" y="1323">Завершение</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2764" y="1388">• Q=0 и все SELL имеют известный статус</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2764" y="1436">• PnL только по реальным сделкам и fee</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2764" y="1484">• Сохранить причины, slippage и полный REPLAY</text><rect fill="#FFFFFF" height="33" opacity="0.8" rx="9" width="810" x="2756" y="1702" /><text fill="#426074" font-family="DejaVu Sans" font-size="19" font-weight="normal" x="2768" y="1725">Не подтверждён Q=0 → НЕ CLOSED</text><polyline fill="none" opacity="0.92" points="892,400.0 940,400.0" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="940,400.0 922.8915050552991,408.26434514811336 922.8915050552991,391.73565485188664" /><polyline fill="none" opacity="0.92" points="1790,400.0 1838,400.0" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="1838,400.0 1820.8915050552991,408.26434514811336 1820.8915050552991,391.73565485188664" /><polyline fill="none" opacity="0.92" points="2688,400.0 2736,400.0" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2736,400.0 2718.891505055299,408.26434514811336 2718.891505055299,391.73565485188664" /><polyline fill="none" opacity="0.92" points="3161.0,640 3161.0,716" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="3161.0,716 3152.7356548518865,698.8915050552991 3169.2643451481135,698.8915050552991" /><polyline fill="none" opacity="0.92" points="2736,956.0 2688,956.0" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2688,956.0 2705.108494944701,947.7356548518866 2705.108494944701,964.2643451481134" /><polyline fill="none" opacity="0.92" points="940,956.0 892,956.0" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="892,956.0 909.1084949447009,947.7356548518866 909.1084949447009,964.2643451481134" /><polyline fill="none" opacity="0.92" points="467.0,1196 467.0,1272" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="467.0,1272 458.73565485188664,1254.8915050552991 475.26434514811336,1254.8915050552991" /><polyline fill="none" opacity="0.92" points="892,1512.0 940,1512.0" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="940,1512.0 922.8915050552991,1520.2643451481133 922.8915050552991,1503.7356548518867" /><polyline fill="none" opacity="0.92" points="1790,1512.0 1838,1512.0" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="1838,1512.0 1820.8915050552991,1520.2643451481133 1820.8915050552991,1503.7356548518867" /><polyline fill="none" opacity="0.92" points="2688,1512.0 2736,1512.0" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2736,1512.0 2718.891505055299,1520.2643451481133 2718.891505055299,1503.7356548518867" /><polyline fill="none" points="3008.0,716 3008.0,681 1365.0,681 1365.0,716" stroke="#169A94" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#169A94" points="1365.0,716 1356.7356548518867,698.8915050552991 1373.2643451481133,698.8915050552991" /><polyline fill="none" points="2263.0,1196 2263.0,1231 637.0,1231 637.0,1196" stroke="#E77826" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#E77826" points="637.0,1196 645.2643451481134,1213.1084949447009 628.7356548518866,1213.1084949447009" /><rect fill="#E9F0F4" height="47" rx="8" width="3538" x="45" y="1780" /><text fill="#294458" font-family="DejaVu Sans" font-size="20" font-weight="normal" x="65" y="1811">ОСНОВНЫЕ ФОРМУЛЫ: PnL = (R + Q × exitVWAP × (1 − комиссия) × (1 − stress) − C) / C;   P_BE = (C − R) / (Q × (1 − комиссия))</text></svg>