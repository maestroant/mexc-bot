<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="2038" version="1.1" viewBox="0 0 3285 2038" width="3285" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FCFDFE" height="2038" width="3285" x="0" y="0" /><rect fill="#0B3654" height="113" rx="18" width="3195" x="45" y="14" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="38" font-weight="bold" x="75" y="62">ОБЩИЙ МЕНЕДЖЕР — TP, ПРОСКАЛЬЗЫВАНИЕ И ЗАЩИТА ПРИБЫЛИ</text><text fill="#D9EAF6" font-family="DejaVu Sans" font-size="21" font-weight="normal" x="76" y="105">Одинаково для FAST и CONFIRMED: вся сделка должна быть учтена до последней монеты</text><rect fill="#EAF6FD" height="395" rx="14" stroke="#0C87D1" stroke-width="2.6" width="1035" x="42" y="160" /><rect fill="#0C87D1" height="76" rx="14" width="1035" x="42" y="160" /><rect fill="#0C87D1" height="33" width="1035" x="42" y="203" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="57" y="174" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="72" y="211">P1</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="142" y="211">BUY заполнился</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="276">• Зафиксировать фактические fills и комиссии</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="324">• C = стоимость BUY + fees</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="372">• Q = реально доступное количество</text><rect fill="#E8F8EF" height="395" rx="14" stroke="#12A360" stroke-width="2.6" width="1035" x="1125" y="160" /><rect fill="#12A360" height="76" rx="14" width="1035" x="1125" y="160" /><rect fill="#12A360" height="33" width="1035" x="1125" y="203" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="1140" y="174" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1155" y="211">P2</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1225" y="211">Поставить TP</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="276">• TP1: +2% на 50%; TP2: +4% на Q-остаток</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="324">• До постановки проверить minNotional/qtyStep</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="372">• Реальное достижение TP = SELL fill</text><rect fill="#F1ECFF" height="395" rx="14" stroke="#7552C7" stroke-width="2.6" width="1035" x="2208" y="160" /><rect fill="#7552C7" height="76" rx="14" width="1035" x="2208" y="160" /><rect fill="#7552C7" height="33" width="1035" x="2208" y="203" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="2223" y="174" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2238" y="211">P3</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2308" y="211">Каждое исполнение</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="276">• Получен SELL fill → R увеличивается</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="324">• Q уменьшается на фактическое qty</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="372">• Повтор события по ID игнорируется</text><rect fill="#FFF7DC" height="395" rx="14" stroke="#E2A115" stroke-width="2.6" width="1035" x="2208" y="621" /><rect fill="#E2A115" height="76" rx="14" width="1035" x="2208" y="621" /><rect fill="#E2A115" height="33" width="1035" x="2208" y="664" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="2223" y="635" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2238" y="672">P4</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2308" y="672">Рассчитать exitVWAP</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="737">• По bids для ВСЕГО оставшегося Q</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="785">• Если bids не хватает → DEPTH_DISAPPEARED</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="833">• Текущие spread+depth уже учтены</text><rect fill="#E4F7F4" height="395" rx="14" stroke="#149B95" stroke-width="2.6" width="1035" x="1125" y="621" /><rect fill="#149B95" height="76" rx="14" width="1035" x="1125" y="621" /><rect fill="#149B95" height="33" width="1035" x="1125" y="664" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="1140" y="635" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1155" y="672">P5</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1225" y="672">Общий прогноз</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="737">• FullPnL = R + Q×exitVWAP×(1-fee) − C</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="785">• StressPNL добавляет возможный extra slip</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="833">• При Q=0 → только фактический PnL</text><rect fill="#FFF2E7" height="395" rx="14" stroke="#E77826" stroke-width="2.6" width="1035" x="42" y="621" /><rect fill="#E77826" height="76" rx="14" width="1035" x="42" y="621" /><rect fill="#E77826" height="33" width="1035" x="42" y="664" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="57" y="635" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="72" y="672">P6</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="142" y="672">Проверка TP1</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="737">• TP1 полностью? частично? не исполнен?</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="785">• Для 20 из 50 проданных R от 20, Q от 80</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="833">• Каждый partial меняет защитный P_BE</text><rect fill="#FFF7DC" height="395" rx="14" stroke="#E2A115" stroke-width="2.6" width="1035" x="42" y="1082" /><rect fill="#E2A115" height="76" rx="14" width="1035" x="42" y="1082" /><rect fill="#E2A115" height="33" width="1035" x="42" y="1125" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="57" y="1096" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="72" y="1133">P7</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="142" y="1133">Общая защита</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1198">• После положительного partial SELL активировать</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1246">• Цель всей сделки 0% или +0.5% (тест)</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1294">• StressFullPnL ≤ цель → срочный выход</text><rect fill="#F1ECFF" height="395" rx="14" stroke="#7552C7" stroke-width="2.6" width="1035" x="1125" y="1082" /><rect fill="#7552C7" height="76" rx="14" width="1035" x="1125" y="1082" /><rect fill="#7552C7" height="33" width="1035" x="1125" y="1125" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="1140" y="1096" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1155" y="1133">P8</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1225" y="1133">Уровень P_BE</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1198">• P_BE=(C−R)/(Q×(1−sellFee))</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1246">• P_LOCK: вместо C берём C×(1+цель)</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1294">• requiredVWAP=P_LOCK/(1−stress)</text><rect fill="#FFF0EF" height="395" rx="14" stroke="#D85257" stroke-width="2.6" width="1035" x="2208" y="1082" /><rect fill="#D85257" height="76" rx="14" width="1035" x="2208" y="1082" /><rect fill="#D85257" height="33" width="1035" x="2208" y="1125" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="2223" y="1096" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2238" y="1133">P9</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2308" y="1133">Приоритет риска</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1198">• HARD_STOP, dump, no depth → немедленный EXIT</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1246">• Time stop или BE/TotalPnL guard → EXIT</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1294">• Нельзя гарантировать продажу в плюс</text><rect fill="#EAF6FD" height="395" rx="14" stroke="#0C87D1" stroke-width="2.6" width="1035" x="2208" y="1543" /><rect fill="#0C87D1" height="76" rx="14" width="1035" x="2208" y="1543" /><rect fill="#0C87D1" height="33" width="1035" x="2208" y="1586" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="2223" y="1557" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2238" y="1594">P10</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="2308" y="1594">Cancel + reconcile</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1659">• Запретить конкурирующие ордера</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1707">• Отменить TP1/TP2 и учесть новые fills</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="2236" y="1755">• Новый Q = BUY − все фактические SELL</text><rect fill="#FFF0EF" height="395" rx="14" stroke="#D85257" stroke-width="2.6" width="1035" x="1125" y="1543" /><rect fill="#D85257" height="76" rx="14" width="1035" x="1125" y="1543" /><rect fill="#D85257" height="33" width="1035" x="1125" y="1586" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="1140" y="1557" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1155" y="1594">P11</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="1225" y="1594">Продать остаток</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1659">• Aggressive LIMIT SELL; ждать до 400 мс</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1707">• До 3 перестановок с cancel+verify</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="1153" y="1755">• Не получилось → проектный fallback</text><rect fill="#E8F8EF" height="395" rx="14" stroke="#12A360" stroke-width="2.6" width="1035" x="42" y="1543" /><rect fill="#12A360" height="76" rx="14" width="1035" x="42" y="1543" /><rect fill="#12A360" height="33" width="1035" x="42" y="1586" /><rect fill="#FFFFFF" height="48" opacity="0.22" rx="11" width="63" x="57" y="1557" /><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="72" y="1594">P12</text><text fill="#FFFFFF" font-family="DejaVu Sans" font-size="29" font-weight="bold" x="142" y="1594">Финальная сверка</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1659">• Q=0 + все ордера известны → CLOSED</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1707">• Есть dust/UNKNOWN → RESIDUAL_OPEN</text><text fill="#173448" font-family="DejaVu Sans" font-size="25" font-weight="normal" x="70" y="1755">• PnL, исполнения и слippage в журнал</text><polyline fill="none" opacity="0.92" points="1077,357.5 1125,357.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="1125,357.5 1107.8915050552991,365.76434514811336 1107.8915050552991,349.23565485188664" /><polyline fill="none" opacity="0.92" points="2160,357.5 2208,357.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2208,357.5 2190.891505055299,365.76434514811336 2190.891505055299,349.23565485188664" /><polyline fill="none" opacity="0.92" points="2725.5,555 2725.5,621" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2725.5,621 2717.2356548518865,603.8915050552991 2733.7643451481135,603.8915050552991" /><polyline fill="none" opacity="0.92" points="2208,818.5 2160,818.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2160,818.5 2177.108494944701,810.2356548518866 2177.108494944701,826.7643451481134" /><polyline fill="none" opacity="0.92" points="1125,818.5 1077,818.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="1077,818.5 1094.1084949447009,810.2356548518866 1094.1084949447009,826.7643451481134" /><polyline fill="none" opacity="0.92" points="559.5,1016 559.5,1082" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="559.5,1082 551.2356548518866,1064.8915050552991 567.7643451481134,1064.8915050552991" /><polyline fill="none" opacity="0.92" points="1077,1279.5 1125,1279.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="1125,1279.5 1107.8915050552991,1287.7643451481133 1107.8915050552991,1271.2356548518867" /><polyline fill="none" opacity="0.92" points="2160,1279.5 2208,1279.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2208,1279.5 2190.891505055299,1287.7643451481133 2190.891505055299,1271.2356548518867" /><polyline fill="none" opacity="0.92" points="2725.5,1477 2725.5,1543" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2725.5,1543 2717.2356548518865,1525.8915050552991 2733.7643451481135,1525.8915050552991" /><polyline fill="none" opacity="0.92" points="2208,1740.5 2160,1740.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="2160,1740.5 2177.108494944701,1732.2356548518867 2177.108494944701,1748.7643451481133" /><polyline fill="none" opacity="0.92" points="1125,1740.5 1077,1740.5" stroke="#40748F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polygon fill="#40748F" points="1077,1740.5 1094.1084949447009,1732.2356548518867 1094.1084949447009,1748.7643451481133" /><rect fill="#E9F0F4" height="47" rx="8" width="3195" x="45" y="1966" /><text fill="#294458" font-family="DejaVu Sans" font-size="20" font-weight="normal" x="65" y="1997">ПРИМЕР: BUY 100 × 0.100, TP1 50 × 0.102 → без комиссий P_BE остатка 0.098; с 0.1% комиссиями P_BE ≈ 0.0984004</text></svg>